<!DOCTYPE html>   
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invitación TODOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #fff6fa 0%, #ffeef4 25%, #ffeef4 75%, #fff6fa 100%);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    #contenido {
      opacity: 0;
      transition: opacity 2s ease;
      display: none;
    }

    #contenido.mostrar {
      display: block;
      opacity: 1;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4.2em;
      color: #c71585;
      margin-bottom: 0.2em;
    }

    p {
      font-family: 'Times New Roman', serif;
      font-size: 1.4em;
      color: #444;
      margin: 0.2em 1em;
    }

    .emoji-line {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2em;
      color: #c71585;
      margin-top: 0.3em;
    }

    button {
      background-color: #b38cc5;
      color: white;
      border: none;
      padding: 1.4em 3em;
      font-size: 1.8em;
      font-family: 'Great Vibes', cursive;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    button:hover {
      transform: scale(1.07);
      background-color: #a07cb2;
    }

    .corner {
      position: absolute;
      width: 240px;
      opacity: 0.7;
      z-index: 1;
    }

    .top-left {
      top: 0;
      left: 0;
    }

    .top-right {
      top: 0;
      right: 0;
      transform: rotate(90deg);
    }

    .bottom-left {
      bottom: 0;
      left: 0;
      transform: rotate(-90deg);
    }

    .bottom-right {
      bottom: 0;
      right: 0;
      transform: rotate(180deg);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 3em;
      }
      p {
        font-size: 1.2em;
      }
      .emoji-line {
        font-size: 2.5em;
      }
      button {
        font-size: 1.5em;
        padding: 1.2em 2.5em;
      }
    }
  </style>
</head>
<body>

  <!-- Esquinas decorativas -->
  <img src="esq.png" class="corner top-left" alt="Decoración esquina">
  <img src="esq.png" class="corner top-right" alt="Decoración esquina">
  <img src="esq.png" class="corner bottom-left" alt="Decoración esquina">
  <img src="esq.png" class="corner bottom-right" alt="Decoración esquina">

  <!-- Botón inicial -->
  <button onclick="mostrarInvitacion()">💖 Oprímeme 💖</button>

  <!-- Contenido que aparece -->
  <div id="contenido">
    <h1>💗 Estan invitados 💗</h1>
    <p>¡Nos alegra compartir este momento tan especial con ustedes!</p> 
    <div class="emoji-line">25 años 💍</div>
  </div>

  <!-- Música -->
  <audio id="musica" src="def.mp3"></audio>

  <script>
    function mostrarInvitacion() {
      document.querySelector("button").style.display = "none";
      const contenido = document.getElementById("contenido");
      contenido.classList.add("mostrar");
      document.getElementById("musica").play();

      setTimeout(() => {
        window.location.href = "https://davidtell.github.io/davidtell/canva.pdf";
      }, 8000);
    }
  </script>
</body>
</html>
