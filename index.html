<!DOCTYPE html>  
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Juan y Laura</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffeef4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4.2em;
      color: #c71585;
      margin-bottom: 0.2em;
    }

    p {
      font-family: 'Times New Roman', serif;
      font-size: 1.4em;
      color: #444;
      margin: 0.2em 1em;
    }

    .emoji-line {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2em;
      color: #c71585;
      margin-top: 0.3em;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 3em;
      }
      p {
        font-size: 1.2em;
      }
      .emoji-line {
        font-size: 2.5em;
      }
    }
  </style>
  <meta http-equiv="refresh" content="5;url=https://davidtell.github.io/davidtell/canva.pdf">
</head>
<body>
  <h1>Juan y Laura 💗</h1>
  <p>¡Nos alegra compartir este momento tan especial con ustedes!</p> 
  <div class="emoji-line">25 años 💍</div>
</body>
</html>
